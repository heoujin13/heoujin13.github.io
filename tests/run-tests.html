<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Running Master 테스트 (개발용)</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; margin: 24px; max-width: 760px; line-height: 1.5; }
    h1 { font-size: 22px; }
    #summary { font-weight: 700; font-size: 18px; margin: 12px 0; }
    li { padding: 4px 0; border-bottom: 1px solid #ddd; list-style: none; }
    .ok::before { content: "✓ "; color: #11804b; font-weight: 700; }
    .fail::before { content: "✗ "; color: #c22c2c; font-weight: 700; }
    .fail small { display: block; color: #c22c2c; margin-left: 1.4em; }
    .error { padding: 12px 16px; border-left: 4px solid #c22c2c; background: #fbe2d7; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>Running Master Ultimate 4.0 — 핵심 로직 테스트 (개발용)</h1>
  <p>앱 화면이 아닙니다. 앱은 프로젝트 폴더 맨 위의 <strong>index.html</strong> 로 실행하세요.</p>
  <p id="summary">실행 중…</p>
  <ul id="results"></ul>
  <script type="module">
    const summary = document.getElementById('summary');
    const list = document.getElementById('results');
    try {
      const { runAll } = await import('./suite.js');
      const { total, passed, failed } = await runAll(({ name, ok, error }) => {
        const li = document.createElement('li');
        li.className = ok ? 'ok' : 'fail';
        li.textContent = name;
        if (!ok) {
          const s = document.createElement('small');
          s.textContent = error;
          li.append(s);
        }
        list.append(li);
      });
      summary.textContent = `${passed}/${total} 통과${failed ? `, ${failed} 실패` : ''}`;
    } catch (err) {
      summary.className = 'error';
      summary.textContent =
        '테스트 파일을 불러오지 못했습니다. VS Code 에서 [파일 → 폴더 열기]로 running-master-ultimate-4 폴더 전체를 연 뒤 실행하세요. ' +
        '(src 폴더에 접근할 수 없는 상태입니다: ' + (err && err.message ? err.message : err) + ')';
    }
  </script>
</body>
</html>
